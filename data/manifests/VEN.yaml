    layer: health
    url: https://data.humdata.org/dataset/hotosm_ven_health_facilities
    hdx_dataset: hotosm_ven_health_facilities
    license: ODbL-1.0
    vintage: "2026-08-06"
    sha256: ""
    notes: >-
      Extracto OSM de HOT, con geometria. Verificado: el dataset existe, es
      ODbL y publica Geopackage. El extracto mezcla POINT, POLYGON y
      MULTIPOLYGON —un hospital grande esta mapeado como edificio, no como
      nodo—, y el agregador toma el centroide de lo que venga.

