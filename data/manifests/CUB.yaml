  - id: overture_buildings
    layer: buildings
    url: s3://overturemaps-us-west-2/release/2026-08-19.0/theme=buildings/type=building
    license: ODbL-1.0
    vintage: "2026-08-19.0"
    sha256: ""
    notes: >-
      No se descarga: DuckDB lee los parquet en remoto podando por la columna
      `bbox`. `type=building` trae las huellas; `type=building_part` es
      geometria auxiliar y contarla inflaria bld_count. Overture fusiona
      OpenStreetMap, Microsoft ML Buildings y Google Open Buildings.

  - id: overture_transportation
    layer: roads
    url: s3://overturemaps-us-west-2/release/2026-08-19.0/theme=transportation/type=segment
    license: ODbL-1.0
    vintage: "2026-08-19.0"
    sha256: ""
    notes: >-
      `type=segment` es la geometria lineal; `type=connector` son nodos. Se
      filtra `subtype = 'road'`: el tema tambien publica ferrocarril y agua.

  - id: cod_ab_cub
    layer: divisions
    url: https://data.humdata.org/dataset/cod-ab-cub
    hdx_dataset: cod-ab-cub
    license: CC-BY-IGO
    vintage: COD-AB-2026-08
    sha256: ""
    notes: >-
      Common Operational Dataset de OCHA, fuente de verdad de adm1/adm2. Es la
      unica geometria administrativa de este manifest, asi que si el recurso
      cambia de nombre el build falla en `pick_admin_source` en vez de construir
      un crosswalk silenciosamente equivocado.
      El nivel municipal se elige por nombre (`admin2`/`adm2`) y, si hay empate,
      por las columnas que el pais declare en ADMIN_COLUMNS. Por defecto se
      asumen las del COD-AB: adm2_pcode, adm2_name, adm1_pcode, adm1_name.

  - id: hotosm_health
    layer: health
    url: https://data.humdata.org/dataset/hotosm_cub_health_facilities
    hdx_dataset: hotosm_cub_health_facilities
    license: ODbL-1.0
    vintage: "2026-08-23"
    sha256: ""
    notes: >-
      Extracto OSM de HOT, con geometria. Verificado: existe, es ODbL y publica
      Geopackage. El extracto mezcla POINT, POLYGON y MULTIPOLYGON —un hospital
      grande esta mapeado como edificio, no como nodo—, y el agregador toma el
      centroide de lo que venga.
      Si algun dia se anade healthsites.io como segunda fuente de salud, tiene
      que ir DESPUES de esta: se deduplica por proximidad contra la primera, y
      en Colombia el 96,6% de sus puntos resulto ser el mismo establecimiento.

