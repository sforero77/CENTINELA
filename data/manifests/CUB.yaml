    license: EC-reuse-attribution
    vintage: R2023A-E2025-54009-100m
    sha256: ""
    notes: >-
      No se descarga esta URL: el mosaico global pesa 5,25 GB. El JRC publica el
      mismo producto en 375 teselas y la seleccion la hace
      pipelines/p0_exposure/sources/ghsl.py a partir de la caja del pais.
      nodata = -200 (todo oceano): enmascarar antes de sumar o la poblacion sale
      negativa. Schiavina et al. 2023, doi:10.2905/2FF68A52.

  - id: ghs_built_s_2025
    layer: built_ghsl
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_100/V1-0/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_100_V1_0.zip
    license: EC-reuse-attribution
    vintage: R2023A-E2025-54009-100m
    sha256: ""
    notes: >-
      Superficie construida en m² por pixel, derivada de Sentinel-2 y Landsat.
      Misma retícula y misma epoca que GHS-POP. No hereda los huecos de OSM en
      asentamientos informales, que es donde el conteo de edificaciones falla y
      donde vive la poblacion mas expuesta. Contrasta a Overture, no lo
      sustituye: mide cuanto hay construido, no cuantas edificaciones son.

  - id: worldpop_agesex_2025
    layer: pop_worldpop_agesex
    url: https://data.worldpop.org/GIS/AgeSex_structures/Global_2015_2030/R2025A/2025/CUB/v1/100m/constrained/
    license: CC-BY-4.0
    vintage: R2025A-2025-constrained-100m
    sha256: ""
    notes: >-
      Verificado: HTTP 200 y las 20 bandas de la serie combinada `cub_t_<edad>`,
      de 00 a 90. La url apunta al DIRECTORIO; solo se baja la serie `_t_`, que
      es la combinada. El mismo directorio publica `_f_` y `_m_`, y sumar las
      tres contaria a cada persona dos veces.

  - id: worldpop_total_2025
