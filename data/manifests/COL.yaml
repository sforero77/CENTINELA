  - id: healthsites_hdx
    layer: health
    url: https://data.humdata.org/dataset/colombia-healthsites
    hdx_dataset: colombia-healthsites
    hdx_resource: "colombia-healthsites-geojson"
    license: ODbL-1.0
    vintage: "2026-06-11"
    sha256: ""
    notes: >-
      healthsites.io publicado en HDX como GeoJSON. Se usa esta via y no la API
      de healthsites.io porque esa exige API key, y O4 pide reconstruir el
      activo sin credenciales privadas.
      `hdx_resource` fija el GeoJSON simple: el dataset publica tambien
      `colombia-healthsites-hxl-geojson`, con etiquetas HXL, 1,2 MB mas grande y
      sin geometria adicional.
      VA SEGUNDO Y ESO IMPORTA. Entra despues de HOTOSM y aporta solo lo que
      HOTOSM no tiene. Medido el 23-ago-2026: de sus 8.443 puntos, el 96,6 %
      cae a menos de 20 m de uno de HOTOSM —las dos fuentes derivan de OSM—, asi
      que su contribucion real son unas 290 sedes. Sumarlas sin deduplicar daria
      18.061 sedes en vez de ~9.900: casi el doble, y con toda la pinta de ser
      una cifra correcta.

