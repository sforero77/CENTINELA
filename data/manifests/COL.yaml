# Manifest de vintages — Colombia (Fase 0).
#
# REGLA DURA: nunca "latest". Overture publica release mensual y su catalogo
# STAC apunta siempre al ultimo; fijar el release explicito es lo que hace que
# un reporte de hace seis meses siga siendo reproducible (RNF-04).
#
# Verificado contra fuentes primarias el 23-ago-2026: cada URL de aqui se probo
# con una peticion real. Los `sha256` se llenan en la primera corrida de P0; el
# lint los reporta como aviso hasta entonces.

manifest_id: col-v0.5
iso3: COL
generated_utc: "2026-08-23T00:00:00Z"

# Referencia oficial para el assert de calidad de §6.4 (totales pais ±1%).
# Medido: GHS-POP E2025 recortado por el limite del MGN 2025 da 52.601.276
# habitantes, es decir -0,75% frente a la proyeccion del DANE. Pasa.
referencia_oficial:
  poblacion_2025: 53000000
  fuente: "DANE, proyecciones de poblacion CNPV-2018 actualizadas (nota tecnica jul-2025)"
  tolerancia_pct: 1.0
  medido_ghs_pop: 52601276
  nota: >-
    La cifra del DANE es la redondeada que publica en su nota tecnica. T0.10:
    reemplazarla por el valor exacto del anexo en Excel de las proyecciones,
    para que el assert compare contra un numero y no contra un redondeo.

notas:
  - "Overture conserva SOLO los dos releases mas recientes en su bucket
     (verificado: 2026-07-22.0 y 2026-08-19.0, listado no truncado). Fijar el
     release da reproducibilidad del calculo, no de la descarga: pasados ~2
     meses la URL deja de existir. Por eso el activo construido se publica como
     Release propio con su sha256 — esa es la copia que sostiene RNF-04."
  - "Las fuentes con `hdx_dataset` NO se descargan por la url de este archivo:
     esa url es la pagina estable del dataset, para poder revisarla a mano. La
     de descarga se resuelve por la API de HDX en cada build. Motivo verificado:
     un mismo dataset de HOTOSM tiene al menos tres formas de URL segun el pais
     (COL, MEX y PER difieren), asi que adivinar la ruta funciona hasta que
     Fase 1 agrega el pais que no encaja."
  - "REPS (salud) y sedes educativas MEN NO estan en este manifest, a
     proposito. Dos razones independientes, ambas verificadas: (a) ninguno de
     los dos datasets trae coordenadas, solo codigo DIVIPOLA y direccion, asi
     que no pueden asignarse a una celda H3 sin geocodificar; (b) ambos son
     CC BY-SA 4.0, copyleft incompatible con la ODbL de Overture: mezclarlos
     produciria una tabla que no se puede licenciar bajo ninguna de las dos.
     Se usaran como referencia de completitud a nivel municipal, en una tabla
     aparte bajo CC BY-SA."

sources:
  - id: ghs_pop_2025
    layer: pop_ghs
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0.zip
    license: EC-reuse-attribution
    vintage: R2023A-E2025-54009-100m
    sha256: ""
    notes: >-
      NO se descarga esta URL: el mosaico global pesa 5,25 GB. El JRC publica el
      mismo producto en 375 teselas y Colombia necesita nueve, que suman 93 MB.
      La seleccion la hace pipelines/p0_exposure/sources/ghsl.py, con el esquema
      de teselado verificado contra la georreferenciacion real. Contrato medido:
      ESRI:54009, 10.000x10.000 px a 100 m, float64, nodata = -200 (unos 22
      millones de celdas por tesela, todo oceano — enmascarar antes de sumar o
      la poblacion sale negativa). R2023A sigue siendo el ultimo release global:
      el R2025A del FTP es solo del Artico. Schiavina et al. 2023,
      doi:10.2905/2FF68A52.

  - id: ghs_built_s_2025
    layer: built_ghsl
    url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_100/V1-0/GHS_BUILT_S_E2025_GLOBE_R2023A_54009_100_V1_0.zip
    license: EC-reuse-attribution
    vintage: R2023A-E2025-54009-100m
    sha256: ""
    notes: >-
      Superficie construida en m² por pixel de 100 m, derivada de Sentinel-2 y
      Landsat. Misma retícula, misma epoca y misma licencia que GHS-POP, asi que
      reutiliza el selector de teselas y no anade dependencias: unos 90 MB mas
      por pais. Verificado que la tesela R9_C11 responde con el mismo esquema de
      nombres que la de poblacion.
      POR QUE ENTRA: la debilidad documentada del conteo de edificaciones de
      Overture son los huecos en asentamientos informales y zona rural dispersa
      —justo donde vive la poblacion mas expuesta—. Esta capa no depende de que
      alguien haya mapeado el barrio, asi que convierte la bandera
      `revisar_sin_edificios` en una cifra: `construido_no_mapeado` marca las
      celdas con mas de 1.000 m² construidos y cero edificaciones registradas.
      LO QUE NO ES: no dice cuantas edificaciones hay ni de que tipo. 40.000 m²
      pueden ser una bodega o cien viviendas. Contrasta a Overture, no lo
      sustituye.

  - id: worldpop_agesex_2025
    layer: pop_worldpop_agesex
    url: https://data.worldpop.org/GIS/AgeSex_structures/Global_2015_2030/R2025A/2025/COL/v1/100m/constrained/
    license: CC-BY-4.0
    vintage: R2025A-2025-constrained-100m
    sha256: ""
    notes: >-
      CORRIGE UN SUPUESTO DE LA ESPEC. §2.2 daba 2020 como la unica epoca con
      desglose por edad y sexo, y de ahi salia la limitacion "proporciones de
      2020 sobre totales de 2025". El release R2025A si publica age-sex
      constrained para 2025 y el supuesto de estructura etaria estable ya no
      hace falta.
      La url apunta al DIRECTORIO, no a un fichero: el listado real trae 62
      GeoTIFF —20 bandas de edad (00, 01, 05, 10 … 90) en tres series, col_f_,
      col_m_ y la combinada col_t_, mas los totales col_T_F / col_T_M. Solo se
      descarga la serie col_t_: sumar las tres contaria cada persona dos veces.
      El conteo de 18 bandas hasta 80 que decia esta nota estaba mal; la banda
      superior es 90+, y por eso pop_65p va de 65 a 90. Ver
      pipelines/p0_exposure/sources/worldpop.py.

