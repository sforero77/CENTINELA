  - id: cod_ab_col
    layer: divisions
    url: https://data.humdata.org/dataset/cod-ab-col
    hdx_dataset: cod-ab-col
    hdx_resource: "COL Administrative Divisions Shapefiles"
    license: CC-BY-IGO
    vintage: COD-AB-2025-05-27
    sha256: ""
    notes: >-
      Common Operational Dataset de OCHA. Para Colombia es el propio MGN del
      DANE reempaquetado, asi que no aporta geometria nueva aqui; entra porque
      el patron `cod-ab-<iso3>` existe verificado para LOS DIECINUEVE paises de
      LATAM hispanohablante mas Brasil, con la misma licencia (CC BY-IGO) y la
      misma forma. Es la via que evita que cada mantenedor de pais tenga que
      ingeniar el geoportal nacional de turno solo para obtener adm1/adm2.
      `hdx_resource` NO es opcional aqui. Este dataset publica cuatro recursos
      SHP y el resolutor tomaba el primero: MGN2024_URB_SECCION.zip, 48 MB de
      secciones urbanas en vez de municipios. Verificado el 23-ago-2026 sobre la
      respuesta real de la API. De los 19 paises revisados, solo Colombia,
      Argentina, Brasil, Paraguay y Uruguay carecen de GeoJSON y caen a SHP; y
      solo Colombia publica mas de un SHP.

  - id: dane_mgn_2025
    layer: divisions
    url: https://geoportal.dane.gov.co/descargas/mgn_2025/MGN2025_MPIO_GRAFICO.zip
    license: CC-BY-4.0
    vintage: MGN-2025
    sha256: ""
    notes: >-
      T0.4 RESUELTA. El Geoportal DANE publica su informacion geografica bajo
      CC BY 4.0: permite uso comercial y redistribucion, y pide citar
      "Departamento Administrativo Nacional de Estadistica - DANE:
      www.dane.gov.co". Fuente de verdad del crosswalk hex<->DIVIPOLA.
      NIVEL MUNICIPAL SUELTO, HALLADO EL 24-AGO-2026. La nota anterior decia
      que el nombre del nivel municipal "no se pudo deducir probando": es
      `MGN2025_MPIO_GRAFICO.zip`, 68 MB. Trae exactamente el mismo
      MGN_ADM_MPIO_GRAFICO.shp que se extraia del archivo nacional de 3,39 GB,
      con su .cpg y su .prj. Verificado: 1.122 municipios, las mismas columnas
      (mpio_cdpmp, mpio_cnmbr, dpto_ccdgo, dpto_cnmbr) y la misma caja
      envolvente (-81,7356..-66,8472 / -4,2294..13,3947) que registro el build.
      SE CAMBIO POR UNA CAIDA, no por elegancia. El geoportal dejo de servir
      peticiones de rango por encima de ~1,5 GB —responde HTTP 206 y cierra la
      conexion sin enviar un byte— y el directorio central de un ZIP esta al
      final, asi que la extraccion por rango del archivo de 3,39 GB dejo de
      funcionar. Habia funcionado nueve horas antes. Con el archivo suelto no
      hacen falta ni rangos ni 3,4 GB.

