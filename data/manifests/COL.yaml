  - id: ourairports
    layer: airports
    url: https://davidmegginson.github.io/ourairports-data/airports.csv
    license: public-domain
    vintage: snapshot-2026-08-01
    sha256: ""
    notes: >-
      T1.2 RESUELTA (23-ago-2026). La dedicacion al dominio publico esta en dos
      sitios, y los dos se leyeron directamente.
      (a) La pagina de datos del proyecto (https://ourairports.com/data/) dice
      literalmente: "All data is released to the Public Domain, and comes with
      no guarantee of accuracy or fitness for use".
      (b) El repositorio de descargas
      (github.com/davidmegginson/ourairports-data) lleva un LICENSE con el texto
      integro de **The Unlicense**: "This is free and unencumbered software
      released into the public domain... Anyone is free to copy, modify,
      publish, use, compile, sell, or distribute this software... for any
      purpose, commercial or non-commercial".
      MATIZ QUE CONVIENE NO ESCONDER: el texto de The Unlicense habla de
      "software", no de datos, y ahi lo que se reutiliza son datos. Es la
      declaracion de la pagina de datos —explicita sobre "all data"— la que
      cubre el caso; el LICENSE la respalda pero no la sustituye. Con las dos,
      la intencion no admite otra lectura.
      El repositorio pide expresamente no abrir pull requests: las correcciones
      se hacen con una cuenta en ourairports.com y entran en el volcado diario.
