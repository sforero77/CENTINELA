    insumos_sha256: "e1a46dfb425aa3dc4b086d189b900a4e5deac158e1480e8339e7342c1ebf2c69"
    notes: >-
      No se descarga esta URL: el mosaico global pesa 5,25 GB. El JRC publica el
      mismo producto en 375 teselas y la seleccion la hace
      pipelines/p0_exposure/sources/ghsl.py a partir de la caja del pais.
