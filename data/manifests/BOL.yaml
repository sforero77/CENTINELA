# Manifest de vintages — Bolivia (Fase 1).
#
# REGLA DURA: nunca "latest". Overture publica release mensual y su catalogo
# STAC apunta siempre al ultimo; fijar el release explicito es lo que hace que
# un reporte de hace seis meses siga siendo reproducible (RNF-04).
#
# ESTADO: activo construido y publicado. La ultima reconstruccion midio
# 12.804.990 habitantes y fijo los `insumos_sha256` de cada fuente
# descargable; las que se leen en remoto no llevan digest porque no pasan por
# disco. Las cifras vivas estan en `medicion.json`, publicado en el Release al
# lado del parquet — aqui no se repiten a mano.

manifest_id: bol-v0.2
iso3: BOL
generated_utc: "2026-08-23T00:00:00Z"

# Referencia oficial para el assert de calidad de §6.4.
#
# Se usa la ONU por uniformidad regional: cada instituto nacional publica con su
# propia metodologia, su propio anio base y su propio calendario censal, y un
# assert que compara diecinueve paises contra diecinueve criterios distintos no
# compara nada. World Population Prospects da una serie homogenea.
#
# Obtenida sin credenciales: el endpoint de datos de la propia ONU responde 401
# y exige un Bearer token, lo que viola O4. La API del Banco Mundial republica
# la serie y responde en abierto; sus metadatos de SP.POP.TOTL citan como fuente
# primaria "World Population Prospects, United Nations (UN), publisher: UN
# Population Division".
#
#   https://api.worldbank.org/v2/country/BOL/indicator/SP.POP.TOTL?format=json&date=2025:2025
#
# Un instituto nacional con censo reciente es mejor referencia que la ONU para
# su propio pais: el mantenedor de pais puede sustituirla, como hace Colombia
# con el DANE, y estrechar la tolerancia.
referencia_oficial:
  poblacion_2025: 12581843
  fuente: "ONU, World Population Prospects (UN Population Division), serie SP.POP.TOTL"
  tolerancia_pct: 2.27
  medido_ghs_pop: 12804990
  nota: >-
    La cifra medida vive en `medido_ghs_pop` y la fija cada build; la
    tolerancia sale de `centinela calibrar`, que la estrecha con lo medido y
    nunca la ensancha sola. Aqui no se repiten numeros a proposito: una prosa
    con cifras se queda contradiciendo al dato de al lado en cuanto se
    recalibra.
    El desvio de GHS-POP frente a la referencia oficial es esperable y no es un
    fallo: GHS-POP desagrega censos con teledeteccion y no reproduce una
    proyeccion demografica. Lo que si era un fallo, y se corrigio el
    24-ago-2026, es que el reparto reclamaba poblacion del pais vecino y no
    veia los municipios multipoligono. La medida antes y despues, pais por
    pais, esta en VERIFICACIONES.md.

notas:
  - "Caja envolvente medida sobre `division_area` de Overture (subtype=country,
     release 2026-08-19.0): lon -69.645..-57.453, lat -22.8983..-9.6689. En COUNTRY_BBOX se declara redondeada
     hacia afuera. El build comprueba que la caja declarada contenga la
     geometria administrativa real, asi que un error aqui falla en vez de
     perder territorio en silencio."
  - "Los `hdx_dataset` NO se descargan por la url de este archivo: esa url es la
     pagina estable del dataset. La de descarga se resuelve por la API de HDX en
     cada build, porque la ruta real de un mismo dataset de HOTOSM cambia de
     forma segun el pais."
  - "Verificado el 2026-08-23: este COD-AB publica un unico recurso del formato
     preferido, asi que no necesita `hdx_resource`. De los 19 paises de LATAM
     revisados, **solo Colombia** publica varios recursos del mismo formato."
  - "PENDIENTE DEL MANTENEDOR DE PAIS antes de publicar un reporte: validar los
     toponimos del COD-AB y su codificacion. En Venezuela salen mal codificados
     ('Falc?n' por 'Falcón') y esos nombres se imprimen en el reporte."

