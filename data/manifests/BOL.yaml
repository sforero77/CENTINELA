    insumos_sha256: "c384061b5471fe0c8017e3b968bc9b03bec16bbe5645d89dcf5e02b7dde66309"
    notes: >-
      Extracto OSM de HOT, con geometria. Verificado: existe, es ODbL y publica
      Geopackage. El extracto mezcla POINT, POLYGON y MULTIPOLYGON —un hospital
      grande esta mapeado como edificio, no como nodo—, y el agregador toma el
      centroide de lo que venga.
      Si algun dia se anade healthsites.io como segunda fuente de salud, tiene
      que ir DESPUES de esta: se deduplica por proximidad contra la primera, y
      en Colombia el 96,6% de sus puntos resulto ser el mismo establecimiento.

