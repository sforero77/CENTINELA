name: P0 · Activo de exposicion (trimestral)

on:
  schedule:
    # Dia 1 de enero, abril, julio y octubre, 06:00 UTC.
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      iso3:
        description: "Pais a reconstruir (ISO3)"
        required: true
        default: COL
        type: string

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    strategy:
      # Un pais que falla no debe impedir que los demas se reconstruyan.
      fail-fast: false
      matrix:
        iso3: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.iso3)) || fromJSON('["COL"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo

      - name: Validar manifest antes de descargar nada
        run: uv run centinela lint-manifests

      - name: Construir exposure_h3
        run: uv run centinela country ${{ matrix.iso3 }}

      - name: Publicar Release versionado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="exposure-$(echo ${{ matrix.iso3 }} | tr '[:upper:]' '[:lower:]')-$(date -u +%Y%m%d)"
          gh release create "$TAG" data/build/**/*.parquet \
            --title "Activo de exposicion ${{ matrix.iso3 }} — $TAG" \
            --notes-file data/manifests/${{ matrix.iso3 }}.yaml
