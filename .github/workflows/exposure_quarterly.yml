name: P0 · Activo de exposicion (trimestral)

# El pais va en el nombre de la corrida: con varios paises en paralelo, la
# lista de Actions es indistinguible sin esto.
run-name: "Activo de exposicion — ${{ inputs.iso3 || 'todos los publicados' }}"

on:
  schedule:
    # Dia 1 de enero, abril, julio y octubre, 06:00 UTC.
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      iso3:
        description: "Pais a reconstruir (ISO3). Vacio = todos los publicados"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  # LA CORRIDA PROGRAMADA RECONSTRUIA UN SOLO PAIS, Y HABIA DIECIOCHO.
  #
  # El workflow fijaba `ISO3: ${{ inputs.iso3 || 'COL' }}` desde cuando Fase 0
  # construia solo Colombia. Fase 1 llego antes de que nadie volviera aqui: hay
  # 18 activos publicados y el trimestral refrescaba uno.
  #
  # No era solo envejecimiento. Los 19 manifests fijan el mismo release de
  # Overture y Overture conserva **dos** (~2 meses): pasado ese plazo, un pais
  # que no se haya reconstruido no se puede reconstruir — la url del release
  # fijado deja de existir. Diecisiete paises a un trimestre de quedarse sin
  # camino de vuelta a sus propias fuentes.
  elegir:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    outputs:
      paises: ${{ steps.lista.outputs.paises }}
    steps:
      - name: Decidir que paises se reconstruyen
        id: lista
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Via env y siempre citada: `inputs.iso3` es texto libre y no debe
          # poder convertirse en comando al interpolarse en un `run`.
          ISO3: ${{ inputs.iso3 }}
        run: |
          if [ -n "$ISO3" ]; then
            echo "$ISO3" | grep -Eq '^[A-Z]{3}$' || {
              echo "::error::ISO3 invalido: $ISO3"; exit 1;
            }
            PAISES=$(printf '["%s"]' "$ISO3")
          else
            # Se reconstruye lo que el sistema **sirve**: los paises con activo
            # publicado. Un pais con manifest y sin Release no se ha construido
            # nunca, y esa primera vez se pide a mano — es la corrida que hay
            # que mirar, porque estrena la tolerancia y los toponimos.
            PAISES=$(gh release list --limit 200 --json tagName --jq '
              [ .[] | .tagName
                | select(startswith("exposure-"))
                | split("-")[1] | ascii_upcase
              ] | unique')
          fi

          # Una matriz vacia no falla: se salta el job entero y la corrida sale
          # verde sin haber reconstruido nada. Es justo el silencio que este
          # repositorio persigue en todas partes.
          #
          # La comprobacion es textual y no con `jq` a proposito: `gh --jq` ya
          # trae su interprete embebido, pero `jq` suelto es un binario mas del
          # runner que este workflow no necesita.
          if [ -z "$PAISES" ] || [ "$PAISES" = "[]" ]; then
            echo "::error::No hay ningun activo publicado que reconstruir."
            exit 1
          fi

          echo "paises=$PAISES" >> "$GITHUB_OUTPUT"
          echo "se reconstruyen: $PAISES"

  construir:
    needs: elegir
    runs-on: ubuntu-latest
    # Un build de un pais grande ronda los 45 min. Con dos horas hay margen de
    # sobra, y una corrida colgada falla en un plazo conocido en vez de ocupar
    # el runner seis horas: el default de GitHub son 360 min.
    timeout-minutes: 120
    strategy:
      # Un pais roto no puede impedir que se reconstruyan los demas: es
      # exactamente el caso en que hay que reconstruir los demas.
      fail-fast: false
      # No es un limite de GitHub, es cortesia con las fuentes: HDX, WorldPop y
      # el bucket de Overture son servicios publicos y gratuitos, y dieciocho
      # descargas simultaneas de ~1 GB son un abuso que ademas acaba en 429.
      max-parallel: 4
      matrix:
        iso3: ${{ fromJSON(needs.elegir.outputs.paises) }}
    env:
      ISO3: ${{ matrix.iso3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo

      - name: Validar manifest antes de descargar nada
        run: uv run centinela lint-manifests

      - name: Validar el codigo de pais
        run: |
          echo "$ISO3" | grep -Eq '^[A-Z]{3}$' || {
            echo "::error::ISO3 invalido: $ISO3"; exit 1;
          }

      - name: Construir exposure_h3
        run: uv run centinela country "$ISO3"

      - name: Publicar Release versionado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="exposure-$(echo "$ISO3" | tr '[:upper:]' '[:lower:]')-$(date -u +%Y%m%d)"
          # `**` no expande sin `shopt -s globstar`, y el bash de Actions lo
          # trae apagado: el glob se quedaba en un solo nivel y el activo vive
          # en data/build/iso3=COL/layer=exposure/. Fallaba con "no matches
          # found" DESPUES de construirlo entero, que es el peor sitio posible.
          # `find` no depende de opciones del shell.
          mapfile -t PARQUETS < <(find data/build -name '*.parquet' -type f)
          if [ ${#PARQUETS[@]} -eq 0 ]; then
            echo "::error::El build no dejo ningun .parquet en data/build"
            exit 1
          fi
          # La medicion pesa un kilobyte y evita bajar el log entero para leer
          # tres numeros al reajustar la tolerancia del manifest.
          mapfile -t MEDICION < <(find data/build -name 'medicion.json' -type f)
          PARQUETS+=("${MEDICION[@]}")
          printf 'publicando: %s\n' "${PARQUETS[@]}"
          # El tag lleva la fecha, asi que dos construcciones el mismo dia
          # chocan — y reconstruir el mismo dia es exactamente lo que pasa
          # cuando se corrige algo. Un Release del mismo dia es una correccion
          # del mismo activo, no un vintage nuevo: se reemplazan los ficheros
          # en su sitio. Dias distintos siguen creando tags distintos, asi que
          # el historial de vintages se conserva.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG ya existe; se reemplazan sus ficheros"
            gh release upload "$TAG" "${PARQUETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "data/manifests/$ISO3.yaml"
          else
            gh release create "$TAG" "${PARQUETS[@]}" \
              --title "Activo de exposicion $ISO3 — $TAG" \
              --notes-file "data/manifests/$ISO3.yaml"
          fi
