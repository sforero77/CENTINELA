name: Visor · Contorno de LATAM

# El contorno ligero que el visor dibuja en la vista regional.
#
# Se regenera a mano cuando cambia el release de Overture, que es trimestral.
# No va en el despliegue del sitio porque leer `divisions` de Overture tarda
# minutos y el contorno solo cambia cuando cambia la fuente.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release de Overture (vacio = el del codigo)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo

      - name: Generar el contorno
        run: |
          uv run centinela contorno-latam --release "${{ inputs.release }}"
          ls -lh site/assets/latam.geojson

      - name: Publicar
        run: |
          git config user.name "centinela-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add site/assets/latam.geojson
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "Visor: regenerar el contorno de LATAM"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
