name: Visor (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "reports/**"
      # Construir un pais cambia la cobertura que el visor publica.
      - "data/manifests/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # La cobertura regional es un derivado de los manifests: cuantos paises
      # tienen activo construido y medido. Se recalcula aqui para que no pueda
      # quedarse vieja — un tablero que promete mas paises de los que hay deja
      # de ser un tablero.
      - name: Recalcular la cobertura regional
        run: |
          uv sync --python 3.12 --no-dev
          uv run centinela cobertura

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r site/* _site/

          # LA VISTA PREVIA APUNTA AL ULTIMO EVENTO, NO A UNO CONGELADO.
          #
          # `og:image` iba clavada en el HTML a `us6000tjl2`. Funcionaba hoy y
          # se rompia en silencio el dia que ese reporte se retirara — y ademas
          # un tablero de crisis compartido por WhatsApp enseñaria siempre el
          # sismo de agosto de 2026, tuviera lo que tuviera delante.
          #
          # Se reescribe aqui, en el unico sitio que sabe que se publica: el
          # despliegue. El HTML del repositorio conserva un valor fijo como
          # respaldo para quien sirva `site/` a secas.
          python3 - <<'PY'
          import json, html, io
          eventos = json.load(io.open("reports/index.json", encoding="utf-8"))
          ultimo = max(eventos, key=lambda e: e.get("utc") or "")
          usgs = ultimo["usgs_id"]
          mag = str(ultimo.get("mag", "")).replace(".", ",")
          lugar = ultimo.get("lugar", "")
          base = "https://sforero77.github.io/CENTINELA"

          p = "_site/index.html"
          s = io.open(p, encoding="utf-8").read()
          import re
          s = re.sub(
              r'(property="og:image" content=")[^"]*(")',
              rf"\g<1>{base}/reports/{usgs}/mapa_prensa.png\g<2>", s, count=1)
          s = re.sub(
              r'(property="og:image:alt" content=")[^"]*(")',
              r"\g<1>" + html.escape(
                  f"Mapa de exposición del M{mag} — {lugar}.", quote=True
              ) + r"\g<2>", s, count=1)
          io.open(p, "w", encoding="utf-8").write(s)
          print(f"og:image -> {usgs} (M{mag}, {lugar})")
          PY
          # Los reportes publicados se sirven junto al visor: sin backend,
          # sin llaves de API, cero SLA que sostener (D6).
          cp -r reports _site/reports

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
