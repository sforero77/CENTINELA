name: Visor (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "reports/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r site/* _site/
          # Los reportes publicados se sirven junto al visor: sin backend,
          # sin llaves de API, cero SLA que sostener (D6).
          cp -r reports _site/reports

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
