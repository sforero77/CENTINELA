name: Simulacro mensual

# §6.5: el pipeline nunca debe oxidarse entre catastrofes. Este simulacro corre
# solo, mide latencia interna y verifica que los artefactos se generan. No
# escribe estado ni publica nada.

on:
  schedule:
    - cron: "0 9 5 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  simulacro:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    steps:
      # `persist-credentials: false`: ESTE JOB NO EMPUJA NADA.
      #
      # `actions/checkout` deja el GITHUB_TOKEN escrito en `.git/config` por
      # defecto, asi que cualquier paso posterior —o cualquier accion de tercero
      # que corra despues— puede usarlo. Aqui no hace falta para nada: el trabajo
      # de este workflow no incluye un `git push`.
      #
      # Es la mitigacion barata del hueco que si queda abierto: **ninguna accion
      # de este repositorio esta fijada por SHA**, todas van por etiqueta movil,
      # y una etiqueta de git se puede reapuntar a cualquier commit.
      # `astral-sh/setup-uv@v5` ademas no es de GitHub. El precedente concreto es
      # tj-actions/changed-files (CVE-2025-30066, marzo de 2025). Fijar por SHA
      # exige resolver catorce digests contra la red y queda en PENDIENTES.md.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12 --extra dev --extra geo

      - name: P1 en seco contra el feed vivo
        run: |
          inicio=$(date +%s)
          uv run centinela trigger --dry-run
          echo "latencia_p1_s=$(( $(date +%s) - inicio ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Golden tests
        run: uv run pytest -m golden

      - name: Abrir issue si el simulacro fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: El simulacro mensual fallo
        run: |
          # `gh issue create --label` aborta si la etiqueta no existe en el
          # repositorio, y aqui nadie las creaba: el simulacro fallaba, este
          # paso fallaba tambien y no quedaba ni el issue ni el aviso.
          gh label create operacion --color 5319E7 --force >/dev/null 2>&1 || true
          gh label create automatico --color BFD4F2 --force >/dev/null 2>&1 || true

          CORRIDA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CUERPO="El simulacro mensual fallo: el pipeline se oxido entre catastrofes.

          Corrida: $CORRIDA"

          # Respaldo sin etiquetas por si `gh label` no pudo crearlas.
          gh issue create --title "$TITULO" --label "operacion,automatico" --body "$CUERPO" \
            || gh issue create --title "$TITULO" --body "$CUERPO"
