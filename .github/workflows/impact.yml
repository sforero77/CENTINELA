name: P2/P3 · Impacto y reporte

on:
  workflow_dispatch:
    inputs:
      usgs_id:
        description: "Identificador USGS del evento"
        required: true
        type: string
  repository_dispatch:
    types: [centinela-evento]

permissions:
  contents: write

# Un job por evento a la vez: dos versiones de ShakeMap del mismo evento no
# deben pisarse. Eventos distintos si corren en paralelo.
concurrency:
  group: impacto-${{ inputs.usgs_id || github.event.client_payload.usgs_id }}
  cancel-in-progress: false

jobs:
  impacto:
    runs-on: ubuntu-latest
    env:
      USGS_ID: ${{ inputs.usgs_id || github.event.client_payload.usgs_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo --extra render

      # El activo no vive en git: 17 MB por pais. Se publica como Release
      # versionado y esa copia es la que sostiene RNF-04, porque Overture
      # retira sus releases a los dos meses (ver docs/PUBLICAR_ACTIVO.md).
      - name: Descargar activo de exposicion
        id: activo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/build
          TAG=$(gh release list --limit 50 \
                 --json tagName --jq '[.[] | select(.tagName | startswith("exposure-col-"))]
                                      | sort_by(.tagName) | last | .tagName')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No hay ningun Release exposure-col-*. Publica el activo antes de operar."
            exit 1
          fi
          gh release download "$TAG" --dir data/build --clobber
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -la data/build

      - name: Calcular impacto y emitir reporte
        id: impacto
        run: |
          uv run centinela impact "$USGS_ID" \
            --detail-url "https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=$USGS_ID&format=geojson" \
            --exposure "data/build/exposure_h3.parquet" \
            --manifest "$(uv run python -c "
          from pipelines.common.manifest import Manifest
          print(Manifest.load('COL').manifest_id)")"

      - name: Publicar artefactos
        if: success()
        run: |
          git config user.name "centinela-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add events/ reports/
          git diff --staged --quiet && exit 0
          git commit -m "P3: reporte de $USGS_ID"
          # Dos eventos simultaneos tienen concurrency groups distintos y
          # empujan a la misma rama: sin rebase uno de los dos se pierde.
          for intento in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((2 ** intento))
          done
          exit 1

      # RNF-03: si el contrato USGS se rompe, el pipeline degrada y deja
      # rastro accionable. Nunca publica datos corruptos en silencio.
      - name: Abrir issue ante fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "P2 fallo para $USGS_ID" \
            --label "pipeline,automatico" \
            --body "El pipeline de impacto fallo. Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
