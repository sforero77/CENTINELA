name: P2/P3 · Impacto y reporte

on:
  workflow_dispatch:
    inputs:
      usgs_id:
        description: "Identificador USGS del evento"
        required: true
        type: string
      backtest:
        description: "Historico que P1 nunca vio (no cuenta para la latencia)"
        required: false
        default: false
        type: boolean
      reprocesar:
        description: "Reemitir aunque USGS no publique nada nuevo (cambio el pipeline)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [centinela-evento]

permissions:
  contents: write
  # Para republicar el visor tras el push. Ver "Republicar el visor".
  actions: write
  # Sin esto el manejador de fallos no puede abrir el issue, que es toda su
  # razon de ser. No estaba.
  issues: write

# Un job por evento a la vez: dos versiones de ShakeMap del mismo evento no
# deben pisarse. Eventos distintos si corren en paralelo.
concurrency:
  group: impacto-${{ inputs.usgs_id || github.event.client_payload.usgs_id }}
  cancel-in-progress: false

jobs:
  impacto:
    runs-on: ubuntu-latest
    env:
      USGS_ID: ${{ inputs.usgs_id || github.event.client_payload.usgs_id }}
      DETAIL_URL: >-
        https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=${{
        inputs.usgs_id || github.event.client_payload.usgs_id }}&format=geojson
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo --extra render

      # El activo no vive en git: unos 19 MB por pais. Se publica como Release
      # versionado y esa copia es la que sostiene RNF-04, porque Overture
      # retira sus releases a los dos meses (ver docs/PUBLICAR_ACTIVO.md).
      #
      # EL ACTIVO ES POR PAIS Y P1 VIGILA TODA LATAM, ASI QUE HAY QUE ELEGIRLO —
      # Y HAY QUE PODER EQUIVOCARSE AL ELEGIR.
      #
      # `countries_for_point` devuelve los paises cuya **caja envolvente**
      # contiene el epicentro, ordenados por area. Las cajas se solapan y el
      # area es un mal criterio: la de Chile mide 1.719 grados cuadrados porque
      # llega a Rapa Nui, y la de Argentina 671. Medido: un M6,7 en Coquimbo
      # sale como `[ARG, CHL, BRA]`.
      #
      # Este paso se quedaba con el primero que tuviera Release. O sea que un
      # sismo chileno se calculaba contra el activo argentino, el join quedaba
      # vacio y **Chile no habria tenido reporte nunca** — uno de los paises mas
      # sismicos de la region.
      #
      # El desempate real lo da el join, como dicen desde el principio las
      # docstrings de `countries_for_point` y de `paises-candidatos`. Aqui se
      # implementa por fin: se prueban los candidatos en orden y el codigo de
      # salida 3 significa "este activo no es de este sismo, sigue".
      - name: Calcular impacto contra el activo del pais que corresponda
        id: impacto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo por despacho manual. Un evento que llega por `repository_dispatch`
          # viene de P1, o sea que su estado existe y es en vivo por definicion.
          BACKTEST: ${{ inputs.backtest && '--backtest' || '' }}
          REPROCESAR: ${{ inputs.reprocesar && '--reprocesar' || '' }}
        run: |
          PAISES=$(uv run centinela paises-candidatos "$USGS_ID" --detail-url "$DETAIL_URL")
          echo "candidatos por epicentro: $PAISES"

          SIN_ACTIVO=""
          DESCARTADOS=""
          for ISO3 in $PAISES; do
            PREFIJO="exposure-$(echo "$ISO3" | tr '[:upper:]' '[:lower:]')-"
            TAG=$(gh release list --limit 100 --json tagName \
                   --jq "[.[] | select(.tagName | startswith(\"$PREFIJO\"))]
                         | sort_by(.tagName) | last | .tagName")
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "sin activo publicado para $ISO3"
              SIN_ACTIVO="$SIN_ACTIVO $ISO3"
              continue
            fi

            echo "::group::probando $ISO3 con $TAG"
            rm -rf data/build && mkdir -p data/build
            gh release download "$TAG" --dir data/build --clobber
            MANIFEST=$(ISO3="$ISO3" uv run python -c "
          import os
          from pipelines.common.manifest import Manifest
          print(Manifest.load(os.environ['ISO3']).manifest_id)")

            set +e
            uv run centinela impact "$USGS_ID" $BACKTEST $REPROCESAR \
              --detail-url "$DETAIL_URL" \
              --exposure "data/build/exposure_h3.parquet" \
              --manifest "$MANIFEST"
            CODIGO=$?
            set -e
            echo "::endgroup::"

            if [ "$CODIGO" -eq 0 ]; then
              echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
              echo "iso3=$ISO3" >> "$GITHUB_OUTPUT"
              echo "::notice::$USGS_ID calculado con el activo de $ISO3 ($TAG)"
              exit 0
            fi
            # Solo el 3 es "prueba el siguiente". Cualquier otro codigo es un
            # fallo de verdad y tiene que abrir issue, no esconderse tras un
            # reintento contra otro pais.
            if [ "$CODIGO" -ne 3 ]; then
              echo "::error::El impacto de $USGS_ID fallo con $ISO3 (codigo $CODIGO)."
              exit "$CODIGO"
            fi
            echo "el activo de $ISO3 no alcanza ninguna celda; se prueba el siguiente"
            DESCARTADOS="$DESCARTADOS $ISO3"
          done

          # AGOTAR LOS CANDIDATOS NO ES LO MISMO QUE FALLAR.
          #
          # Si todos se descartaron por **no alcanzar celdas** —y ninguno por
          # faltar el activo— el enrutado acerto y lo que pasa es que la
          # sacudida no llego a poblacion. Es el caso de un M5,6 a 71 km mar
          # adentro, y hay que publicarlo: el ShakeMap se revisa, la version
          # siguiente puede alcanzar tierra, y solo se seguira mirando si el
          # evento esta en el catalogo. Descartarlo es dejar de mirar.
          #
          # Se reintenta con el primer candidato, el mejor por epicentro.
          PRIMERO=$(echo $PAISES | awk '{print $1}')
          if [ -z "$SIN_ACTIVO" ] && [ -n "$PRIMERO" ]; then
            echo "::notice::Ningun activo alcanza celdas para $USGS_ID: la sacudida no llego a poblacion. Se publica con ceros usando $PRIMERO."
            PREFIJO="exposure-$(echo "$PRIMERO" | tr '[:upper:]' '[:lower:]')-"
            TAG=$(gh release list --limit 100 --json tagName \
                   --jq "[.[] | select(.tagName | startswith(\"$PREFIJO\"))]
                         | sort_by(.tagName) | last | .tagName")
            rm -rf data/build && mkdir -p data/build
            gh release download "$TAG" --dir data/build --clobber
            MANIFEST=$(ISO3="$PRIMERO" uv run python -c "
          import os
          from pipelines.common.manifest import Manifest
          print(Manifest.load(os.environ['ISO3']).manifest_id)")
            uv run centinela impact "$USGS_ID" $BACKTEST $REPROCESAR \
              --detail-url "$DETAIL_URL" \
              --exposure "data/build/exposure_h3.parquet" \
              --manifest "$MANIFEST" \
              --aunque-no-alcance
            echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
            echo "iso3=$PRIMERO" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Ningun activo sirvio para $USGS_ID. Candidatos: [$PAISES].\
          Descartados por no alcanzar celdas:[$DESCARTADOS]. Sin activo publicado:\
          [$SIN_ACTIVO]. Si falta un pais, construyelo con: \
          gh workflow run exposure_quarterly.yml -f iso3=<ISO3>"
          exit 1

      - name: Publicar artefactos
        id: publicar
        if: success()
        run: |
          git config user.name "centinela-bot"
          git config user.email "noreply@users.noreply.github.com"

          # La latencia se calcula sola a partir de los timestamps del
          # `event_state`, pero hay que **recalcularla y publicarla**: este paso
          # anadia `events/` y `reports/` y no `site/status.json`, asi que la
          # pagina de estado se quedaba en la version anterior. Medido: tres
          # reportes publicados el 25-ago y un status.json del 23-ago que
          # listaba un solo evento.
          #
          # No es cosmetico. "Latencia medida y publicada" es uno de los dos
          # requisitos que quedan para cerrar Fase 0, y no lo cerraba el primer
          # sismo: lo bloqueaba este `git add`.
          uv run centinela status

          git add events/ reports/ site/status.json
          git diff --staged --quiet && exit 0
          git commit -m "P3: reporte de $USGS_ID"

          # Dos eventos simultaneos tienen concurrency groups distintos y
          # empujan a la misma rama. Con rebase basta para `events/` y para el
          # directorio del evento, que son disjuntos — pero NO para los ficheros
          # **derivados**, que los dos jobs reescriben enteros y que por tanto
          # conflictan siempre.
          #
          # Paso de verdad al reemitir los dos mainshocks de Venezuela, que es
          # justo el caso para el que existe G2: el segundo murio con
          # "CONFLICT (content): Merge conflict in reports/index.json" y su
          # reporte, ya calculado, no llego a publicarse.
          #
          # Un derivado no se fusiona: se regenera. El indice sale de los
          # `report.json` del directorio y la pagina de estado de los
          # `event_state`, asi que ninguno de los dos tiene contenido propio que
          # una fusion pudiera salvar.
          #
          # La lista esta aqui una sola vez. Cuando entro `site/status.json`
          # este manejador solo conocia `reports/index.json`, y el segundo
          # derivado habria tumbado la publicacion del segundo evento
          # exactamente igual que el primero.
          DERIVADOS='reports/index.json site/status.json'

          regenerar_derivados() {
            local conflictos
            conflictos=$(git diff --name-only --diff-filter=U)
            [ -n "$conflictos" ] || return 1
            # Un conflicto fuera de la lista es real y no se toca: regenerar
            # a ciegas descartaria el trabajo del otro job.
            if grep -qvE '^(reports/index\.json|site/status\.json)$' <<<"$conflictos"; then
              return 1
            fi
            echo "::notice::derivados en conflicto; se regeneran en vez de fusionarse"
            uv run centinela reindexar
            uv run centinela status
            # shellcheck disable=SC2086
            git add $DERIVADOS
            GIT_EDITOR=true git rebase --continue
          }

          # El push es la unica salida buena, y hay dos caminos que llegan a
          # el. Que los dos avisen de lo mismo, en vez de que uno se olvide.
          publicado() {
            echo "publicado=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          for intento in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push && publicado
            elif regenerar_derivados; then
              git push && publicado
            else
              git rebase --abort || true
            fi
            sleep $((2 ** intento))
          done
          exit 1

      # UN PUSH HECHO CON `GITHUB_TOKEN` NO DISPARA OTROS WORKFLOWS.
      #
      # Regla de GitHub contra los bucles infinitos, y aqui era el fallo mas
      # caro del sistema: este paso commitea `reports/`, `site.yml` escucha
      # `reports/**`, y el visor no se enteraba. **Un reporte de un sismo real
      # se habria publicado en el repositorio y no habria aparecido nunca en la
      # pagina.**
      #
      # Nada fallaba: los dos workflows en verde y el reporte correcto en su
      # sitio. El fallo vivia en el hueco entre ellos.
      #
      # Se descubrio el 26-ago-2026 tirando del hilo de por que un M4,9 sentido
      # en Colombia no se veia en el visor. `/status` en vivo llevaba diecisiete
      # horas congelado y nadie lo habia notado, porque hasta hoy ningun sismo
      # habia llegado a reporte por esta via.
      #
      # `workflow_dispatch` es la excepcion documentada a la regla, y es el
      # mismo mecanismo con el que P1 dispara este workflow.
      - name: Republicar el visor
        if: steps.publicar.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml


      # RNF-03: si el contrato USGS se rompe, el pipeline degrada y deja
      # rastro accionable. Nunca publica datos corruptos en silencio.
      - name: Abrir issue ante fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Las etiquetas se crean si no existen. Sin esto el manejador de
          # fallos **falla el mismo**: paso de verdad —"could not add label:
          # 'pipeline' not found"— y el issue nunca se abrio, justo en la
          # corrida que habia que investigar. Una red de seguridad que depende
          # de configuracion previa del repo no es una red: es otro punto de
          # fallo, y encima uno que solo se nota cuando ya hay un problema.
          gh label create pipeline --color 0E8A16 --force >/dev/null 2>&1 || true
          gh label create automatico --color BFD4F2 --force >/dev/null 2>&1 || true
          CUERPO="El pipeline de impacto fallo. Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --title "P2 fallo para $USGS_ID" \
                          --label "pipeline,automatico" --body "$CUERPO" \
            || gh issue create --title "P2 fallo para $USGS_ID" --body "$CUERPO"
