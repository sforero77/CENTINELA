name: Deriva de contrato de fuentes (nocturno)

# §6.2: este es el unico workflow que consulta las fuentes vivas. Solo
# **alerta**; no bloquea. Si USGS cambia el esquema, queremos enterarnos por un
# issue a las 3 a.m. y no por un reporte corrupto durante un terremoto.
#
# Cubre tambien Overture y WorldPop, que son los contratos que el activo de
# exposicion necesita para reconstruirse: Overture publica release mensual y
# solo conserva dos, asi que el release fijado en el manifest caduca solo.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Con --extra dev a secas las pruebas de Overture se saltan por falta
      # de h3/duckdb, y un salto silencioso en el unico guardia nocturno es
      # peor que no tenerlo.
      - run: uv sync --python 3.12 --extra dev --extra geo

      - name: Contrastar las fuentes vivas contra el contrato
        id: drift
        run: uv run pytest -m network

      - name: Abrir issue si el contrato cambio
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Posible deriva del contrato de una fuente" \
            --label "contrato,automatico" \
            --body "El test nocturno contra las fuentes vivas fallo. Revisar schemas/usgs/ (feed de USGS), data/manifests/ (release de Overture fijado) y pipelines/p0_exposure/sources/ antes del proximo evento. Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
