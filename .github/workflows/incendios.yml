name: P5 · Focos activos

# Cada seis horas, y el numero no es arbitrario: FIRMS tarda unas tres en
# publicar sus detecciones, asi que mas frecuencia no traeria dato nuevo, y
# menos dejaria la capa vieja delante de quien la mira.
#
# Un cron de seis horas se estrangula ademas mucho menos que el `*/10` del
# vigia sismico, que el 26-ago-2026 llego a 309 minutos de hueco despues de un
# dia de builds pesados. Aqui esa demora no duele: el fichero de FIRMS es una
# ventana movil de 24 h y un retraso de una hora no pierde nada.

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Para abrir y cerrar la incidencia de un satelite mudo.
  issues: write
  # Para republicar el visor tras el push. Ver "Republicar el visor".
  actions: write

concurrency:
  group: incendios
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # Hace falta `geo`: la agregacion a H3 va por DuckDB con su extension.
      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo

      # El fuego no respeta fronteras y hay diecinueve activos, asi que se
      # cargan todos los publicados y se cruza contra el conjunto. Son ~19 MB
      # por pais; bajarlos cuesta menos que decidir cuales hacen falta.
      - name: Bajar los activos publicados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/activos
          gh release list --limit 200 --json tagName \
            --jq '[.[] | .tagName | select(startswith("exposure-"))]
                  | group_by(split("-")[1]) | map(sort | last) | .[]' \
          | while read -r TAG; do
              ISO=$(echo "$TAG" | cut -d- -f2)
              mkdir -p "data/activos/$ISO"
              gh release download "$TAG" --dir "data/activos/$ISO" --clobber \
                --pattern "exposure_h3.parquet" || echo "::warning::sin activo para $ISO"
            done
          echo "activos: $(find data/activos -name '*.parquet' | wc -l)"

      - name: Leer FIRMS y publicar la capa
        id: incendios
        run: uv run centinela incendios --exposure 'data/activos/*/exposure_h3.parquet'

      # SI EL TOPE DE TAMANIO MORDIO, LA CORRIDA LO DICE.
      #
      # `MAX_CELDAS` prometia que un recorte "se dice a gritos", y el grito era
      # un log que nadie abre (auditoria #177). El aviso ya viaja dentro de
      # `incendios.json`; esto lo saca a la pagina de la corrida como anotacion
      # de error y al resumen. Sin `exit 1`: publicar 60.000 celdas avisando
      # vale mas que no publicar ninguna, asi que el paso sigue.
      - name: Avisar si el tope recorto la capa
        run: |
          RECORTADAS=$(jq '.totales.celdas - .totales.celdas_publicadas' site/incendios.json)
          if [ "${RECORTADAS:-0}" -gt 0 ]; then
            TOTAL=$(jq '.totales.celdas' site/incendios.json)
            MENSAJE="El tope de seguridad dejo fuera $RECORTADAS de $TOTAL celdas: el mapa publicado NO es todo lo que arde."
            echo "::error title=Focos activos recortados::$MENSAJE"
            echo "### Focos activos recortados" >> "$GITHUB_STEP_SUMMARY"
            echo "$MENSAJE Los totales del fichero si son de todas las celdas." >> "$GITHUB_STEP_SUMMARY"
          fi

      # UN SATELITE MUDO ABRE INCIDENCIA.
      #
      # Suomi-NPP se retiro el 1-nov-2026 y FIRMS siguio sirviendo sus ficheros
      # con HTTP 200 y cero filas: dos semanas en verde con un tercio menos de
      # miradas. El aviso viaja en `incendios.json`; esto lo lleva a una
      # incidencia, que es lo que llega al correo. Se cierra sola al volver.
      - name: Avisar si un satelite dejo de entregar
        if: always() && steps.incendios.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITULO: Un satelite de FIRMS dejo de entregar detecciones
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MUDOS=$(jq -r '(.lectura.satelites_mudos // []) | join(", ")' site/incendios.json)
          ABIERTA=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)
          if [ -z "$MUDOS" ]; then
            if [ -n "$ABIERTA" ]; then
              gh issue close "$ABIERTA" --reason completed --comment "Todos los satelites volvieron a entregar. Corrida: $CORRIDA"
            fi
            exit 0
          fi
          echo "::warning title=Satelite mudo::$MUDOS sin una sola deteccion en 24 h"
          if [ -n "$ABIERTA" ]; then
            gh issue comment "$ABIERTA" --body "Sigue mudo: $MUDOS ($(date -u +%Y-%m-%d\ %H:%M) UTC). Corrida: $CORRIDA"
            exit 0
          fi
          gh label create automatico --color BFD4F2 --force >/dev/null 2>&1 || true
          CUERPO="FIRMS respondio, pero estos satelites no trajeron ni una deteccion en ninguna region en la ventana de 24 h: **$MUDOS**.

          Lo mas probable es que el satelite se haya retirado o este en mantenimiento (asi paso con Suomi-NPP el 1-nov-2026). Si es definitivo, hay que quitarlo de \`SATELITES\` en \`pipelines/p5_incendios/firms.py\` y corregir la documentacion de P5.

          La capa se sigue publicando con los demas. Esta incidencia se cierra sola cuando todos vuelvan a entregar.

          Corrida: $CORRIDA"
          gh issue create --title "$TITULO" --label automatico --body "$CUERPO" \
            || gh issue create --title "$TITULO" --body "$CUERPO"

      - name: Publicar
        id: publicar
        env:
          CELDAS: ${{ steps.incendios.outputs.celdas }}
        run: |
          git config user.name "centinela-bot"
          git config user.email "noreply@users.noreply.github.com"

          git add site/incendios.json
          git diff --staged --quiet && exit 0
          git commit -m "P5: focos activos ($CELDAS celdas)"

          for intento in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push && { echo "publicado=true" >> "$GITHUB_OUTPUT"; exit 0; }
            else
              # `incendios.json` se reescribe entero en cada corrida: no se
              # fusiona, se regenera. Y sin abortar, el rebase a medias envenena
              # los tres reintentos siguientes.
              git checkout --theirs site/incendios.json 2>/dev/null || true
              git rebase --abort || true
            fi
            sleep $((2 ** intento))
          done
          exit 1

      # Un push con GITHUB_TOKEN no dispara site.yml. Ver trigger.yml.
      - name: Republicar el visor
        if: steps.publicar.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml

      # Y por la misma regla, las comprobaciones sobre la capa nueva: el visor
      # cuenta que pinte tantas celdas como trae `incendios.json`. Ver datos.yml.
      - name: Comprobar lo que se acaba de publicar
        if: steps.publicar.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run datos.yml
