name: Fase 2 · Contraste con evaluacion de dano externa

# Exposicion no es dano. Este workflow compara lo que CENTINELA publica con lo
# que otro midio del mismo sismo, sobre las mismas celdas H3.
#
# No corre solo: se dispara a mano con el evento y el dataset, porque para cada
# sismo hay que saber quien publico que y con que licencia. Automatizar el
# descubrimiento seria automatizar una decision de atribucion.

on:
  workflow_dispatch:
    inputs:
      usgs_id:
        description: "Identificador USGS del evento"
        required: true
        type: string
      fuente:
        description: "URL del vector de dano (https://... ; se lee por rangos)"
        required: true
        type: string
      crs:
        description: "EPSG del vector de dano (p. ej. EPSG:32619)"
        required: true
        type: string
      etiqueta:
        description: "Quien publica la evaluacion, para la atribucion"
        required: true
        type: string
      columna:
        description: "Columna binaria de dano"
        required: false
        default: "damaged"
        type: string

permissions:
  contents: read

jobs:
  contrastar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USGS_ID: ${{ inputs.usgs_id }}
      DETAIL_URL: >-
        https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=${{
        inputs.usgs_id }}&format=geojson
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar nucleo + geo
        run: uv sync --python 3.12 --extra geo

      # Mismo enrutado por epicentro que P2: el activo es por pais y el sismo
      # dice cual. Duplicar el ISO3 a mano seria duplicar una fuente de error.
      - name: Descargar activo del pais del evento
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/build
          PAISES=$(uv run centinela paises-candidatos "$USGS_ID" --detail-url "$DETAIL_URL")
          echo "candidatos por epicentro: $PAISES"
          for ISO3 in $PAISES; do
            PREFIJO="exposure-$(echo "$ISO3" | tr '[:upper:]' '[:lower:]')-"
            TAG=$(gh release list --limit 100 --json tagName \
                   --jq "[.[] | select(.tagName | startswith(\"$PREFIJO\"))]
                         | sort_by(.tagName) | last | .tagName")
            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
              gh release download "$TAG" --dir data/build --clobber
              echo "usando $TAG para $ISO3"
              exit 0
            fi
          done
          echo "::error::Sin activo publicado para el pais de $USGS_ID"
          exit 1

      - name: Contrastar
        id: contraste
        run: |
          # `| tee` devuelve el codigo de tee, no el del comando: la primera
          # corrida de este workflow salio "success" con un traceback dentro.
          set -o pipefail
          uv run centinela contraste "${{ inputs.fuente }}" \
            --exposure data/build/exposure_h3.parquet \
            --etiqueta "${{ inputs.etiqueta }}" \
            --crs "${{ inputs.crs }}" \
            --columna "${{ inputs.columna }}" | tee contraste.json

      # Una celda evaluada que el activo no tiene es un hueco de cobertura y el
      # comando sale con codigo 2. Se avisa sin tumbar la corrida: el contraste
      # ya esta calculado y su valor es justamente ese numero.
      - name: Avisar de huecos de cobertura
        if: failure()
        run: |
          echo "::warning::Hay celdas evaluadas que el activo no cubre. Ver contraste.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contraste-${{ inputs.usgs_id }}
          path: contraste.json
