name: Rezago de los reportes publicados

# LO QUE EL REPASO NO VE, Y SE RE-EMITE SOLO.
#
# `repaso.yml` cumple RF-04 para los eventos de los ultimos noventa dias,
# backtests incluidos desde el 8-sep-2026. Le quedan dos huecos: un ShakeMap que
# USGS revise pasado ese plazo, y un cambio en la receta del activo de un pais,
# que no es una version de USGS. El 1-sep-2026 el Choco publicaba el ShakeMap v7
# con el v8 ya servido, y se supo porque alguien re-emitio a mano por otro
# motivo.
#
# HASTA EL 13-SEP-2026 ESTO INFORMABA Y UNA PERSONA DECIDIA, porque re-emitir
# movia cifras que el README citaba a mano. Ese dia el README dejo de publicar
# cifras, y un aviso que espera a que alguien lo lea es justo lo que este
# proyecto intenta no tener: ahora re-emite solo. Lo unico que sigue pidiendo
# una persona es un reporte cuyo producto ya no esta en USGS, porque
# re-emitirlo no lo arregla. Lo vigila `tests/unit/test_lo_atrasado_se_reemite_solo.py`.

on:
  schedule:
    # Lunes a las 07:23 UTC. Semanal y no diario porque esto se mueve despacio:
    # el activo de exposicion se reconstruye cada trimestre y lo reciente ya lo
    # cubre el repaso diario. Un dia de retraso en re-emitir un historico no
    # cambia ninguna decision; veintisiete peticiones diarias a USGS para eso, si.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      reemitir:
        description: "Re-emitir los rezagados que encuentre (desmarcar para solo mirar)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  # Para `gh workflow run impact.yml` sobre cada rezagado.
  actions: write

concurrency:
  group: rezago
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    if: github.repository == 'sforero77/CENTINELA'
    steps:
      # `persist-credentials: false`: ESTE JOB NO EMPUJA NADA.
      #
      # `actions/checkout` deja el GITHUB_TOKEN escrito en `.git/config` por
      # defecto, asi que cualquier paso posterior —o cualquier accion de tercero
      # que corra despues— puede usarlo. Aqui no hace falta para nada: el trabajo
      # de este workflow no incluye un `git push`.
      #
      # Y va con el otro cierre del mismo hueco: **todas las acciones estan
      # fijadas por SHA** desde el 6-sep-2026, con la version en el comentario
      # de al lado. Una etiqueta de git se puede reapuntar a cualquier commit
      # —el precedente es tj-actions/changed-files, CVE-2025-30066— y
      # `astral-sh/setup-uv` ademas no es de GitHub. Lo vigila
      # `tests/unit/test_las_acciones_van_fijadas.py`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Instalar nucleo
        run: uv sync --python 3.12 --no-dev

      # Sale distinto de cero solo si no se pudo consultar NINGUNO. Que haya
      # rezago no es un fallo: es trabajo que el paso siguiente despacha, y
      # pintarlo de rojo cada lunes que hubo algo que actualizar enseñaria a
      # ignorar el rojo.
      - name: Comparar cada reporte con lo que sus fuentes sirven hoy
        id: comprobar
        run: uv run centinela rezagados

      # SE COMPRUEBA EL EVENTO, NO SOLO EL INPUT.
      #
      # En un evento `schedule` el contexto `inputs` no existe y
      # `inputs.reemitir` es nulo. La corrida programada tiene que re-emitir, asi
      # que se pregunta primero por el evento; el input solo cuenta cuando
      # alguien lanza el workflow a mano y lo desmarca para mirar sin tocar nada.
      - name: Re-emitir los rezagados
        id: reemitir
        if: >-
          steps.comprobar.outputs.ids_reemitir != ''
          && (github.event_name == 'schedule' || inputs.reemitir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDS: ${{ steps.comprobar.outputs.ids_reemitir }}
          RESUMEN: ${{ steps.comprobar.outputs.resumen }}
        run: |
          N=0
          for ID in $IDS; do
            # `backtest=true` no marca como historico a un evento en vivo: el
            # indicador solo se consulta cuando el evento no tiene estado, y todo
            # reporte publicado lo tiene. `reprocesar=true` hace falta para los
            # que van atras en el activo, porque USGS no publico nada nuevo y sin
            # el P2 sale con «misma version».
            gh workflow run impact.yml -f usgs_id="$ID" -f backtest=true -f reprocesar=true
            echo "despachado $ID"
            N=$((N + 1))
            # No por prudencia con el push —impact.yml rebasa— sino para no
            # encolar todos los runners a la vez.
            sleep 20
          done
          echo "despachados=$N" >> "$GITHUB_OUTPUT"

          # Si una re-emision falla, `impact.yml` abre su propia incidencia por
          # evento y la cierra cuando vuelve a salir. Aqui solo queda el rastro.
          {
            echo "### Re-emitidos: $N"
            echo
            echo "$RESUMEN"
          } >> "$GITHUB_STEP_SUMMARY"

      # UNA SOLA INCIDENCIA, REESCRITA — NO COMENTADA, Y SOLO CON LO QUE NO SE
      # ARREGLA SOLO.
      #
      # Lo re-emitido no se anota aqui: si falla, lo dice `impact.yml`. Queda lo
      # que re-emitir no arregla, que es un reporte cuyo producto ya no esta en
      # USGS. Puede seguir pendiente semanas con toda razon; comentar cada lunes
      # convertiria la incidencia en un hilo que nadie lee, y reescribir el
      # cuerpo deja siempre a la vista la lista de hoy y solo la de hoy.
      - name: Anotar lo que re-emitir no arregla
        if: steps.comprobar.outputs.hay_manuales == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: Reportes que citan un producto que USGS ya no sirve
          RESUMEN: ${{ steps.comprobar.outputs.resumen_manuales }}
        run: |
          gh label create pipeline --color 0E8A16 --force >/dev/null 2>&1 || true
          gh label create automatico --color BFD4F2 --force >/dev/null 2>&1 || true

          CORRIDA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          CUERPO="Estos reportes publicados citan una version de un producto que
          USGS ya no sirve en el detail del evento, y re-emitirlos no lo arregla:

          $RESUMEN

          Puede ser un retiro de USGS o una respuesta a medias. Hay que mirar el
          detail del evento antes de tocar el reporte publicado.

          Esta incidencia se reescribe cada lunes con la lista del dia y se
          cierra sola en cuanto no quede ninguno.

          Corrida: $CORRIDA"

          ABIERTA=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)

          if [ -n "$ABIERTA" ]; then
            gh issue edit "$ABIERTA" --body "$CUERPO"
            echo "Actualizada la incidencia #$ABIERTA con la lista de hoy."
          else
            gh issue create --title "$TITULO" \
              --label "pipeline,automatico" --body "$CUERPO" \
              || gh issue create --title "$TITULO" --body "$CUERPO"
          fi

      # La otra mitad: saber decir "ya no queda ninguno". Sin esto la alarma
      # solo sabe encenderse, y una que no se apaga deja de leerse.
      - name: Cerrar la incidencia si ya no queda ninguno
        if: steps.comprobar.outputs.hay_manuales == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: Reportes que citan un producto que USGS ya no sirve
        run: |
          ABIERTA=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)
          if [ -n "$ABIERTA" ]; then
            gh issue close "$ABIERTA" --comment "Ningun reporte publicado cita ya un producto que USGS no sirva."
            echo "Cerrada la incidencia #$ABIERTA."
          else
            echo "Nada que cerrar: no habia incidencia abierta."
          fi
