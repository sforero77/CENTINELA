[project]
name = "centinela"
version = "0.1.0"
description = "Sistema de exposicion sismica automatizada para LATAM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Comunidad GeoAI LATAM" }]

# Dependencias del camino critico (P1 -> P3). Se mantienen deliberadamente
# minimas: el trigger debe poder correr en un runner frio en segundos.
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Geo-computo (P0/P2). Pesado; no se instala en el job de trigger.
geo = [
  "duckdb>=1.1",
  "h3>=4.1",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyarrow>=17.0",
]
# Render del mapa estatico del reporte. T0.8 resuelta: matplotlib solo, sin
# teselas de fondo — ver pipelines/p3_report/static_map.py.
render = [
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-python-dateutil",
  "types-jsonschema",
]

[project.scripts]
centinela = "pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pipelines", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en espanol con acentos/comillas

[tool.ruff.lint.isort]
known-first-party = ["pipelines"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["pipelines", "tests"]
# Hay un conftest.py por directorio de pruebas; sin esto mypy los ve como dos
# modulos llamados igual y se detiene antes de revisar nada.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "duckdb.*", "h3.*", "rasterio.*", "contextily.*", "matplotlib.*",
  "shapely.*", "pyarrow.*", "pyproj.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Por defecto ninguna prueba toca la red; el workflow nocturno de deriva de
# contrato lo revierte con `-m network` explicito.
addopts = "-q --strict-markers -m 'not network'"
markers = [
  "golden: pruebas de regresion contra eventos reales congelados",
  "network: requiere red viva (excluida de CI de PR)",
  "geo: requiere el extra [geo]",
  "render: requiere el extra [render]",
]

[tool.coverage.run]
source = ["pipelines"]
